<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
    <title>Blackprint Viewer</title>

    <meta http-equiv="Content-Security-Policy" content="
        default-src
            https://fonts.googleapis.com
            https://fonts.gstatic.com
            https://*.vscode-resource.vscode-cdn.net
            vscode-file://vscode-app/
            /*blackprintCspWhitelist*/
            'unsafe-inline' 'unsafe-eval' blob: data:;
    ">

	<script src="(out-folder)/assets/scarletsframe.modern.js"></script>
	<script type="text/javascript">
		window.$ = sf.$;
        window.isNode = false;
        window.vscodeOutPath = "(out-folder)";
        window.vscode = acquireVsCodeApi();
        window.blackprintModules = /*blackprintModules*/1;
        window.blackprintSkeletons = /*blackprintSkeletons*/1;

        console._log = console.log;
        console.log = function(...args){
            console._log(...args);

            for (let i=args.length-1; i >= 0; i--) {
                let prev = args[i-1];
                let current = args[i];
                if(!prev || !prev.includes || !current || !current.includes) continue;

                // Remove style on console log if exist
                if(prev.includes('%c') && current.includes(':')) {
                    prev = args[i-1] = prev.split('%c').join('');
                    args.splice(i, 1);
                }
            }

            let message = args.join(' ');
            vscode.postMessage({ type: 'editorConsoleLog', data: { message } });
        }

        // 1 = Will not replace model/component value (only replace function)
        // 2 = Replace all
        if(sf.hotReload !== void 0) sf.hotReload(1);
    </script>
